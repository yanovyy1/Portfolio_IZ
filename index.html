<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Novyy — Lead Motion Designer</title>
<meta name="description" content="Portfolio of Ivan Zosimov (Novyy) — Lead Motion Designer / AI Designer.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23000%22/><text x=%2250%22 y=%2266%22 font-size=%2260%22 font-family=%22sans-serif%22 fill=%22%23fff%22 text-anchor=%22middle%22>N</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="grain"></div>

<div class="page">

  <header class="top-head fade-in">
    <h1 class="title-line">
      <span class="title-script">Vanya Novyy</span>
      <span class="title-tag">Motion Designer</span>
    </h1>
    <div class="contact-icons">
      <a href="mailto:yanovyy1@gmail.com" class="icon-btn" aria-label="Send an email">mail</a>
      <a href="https://t.me/yanovyy" target="_blank" rel="noopener" class="icon-btn" aria-label="Telegram">tg</a>
      <a href="tel:+79091635066" class="icon-btn" aria-label="Call">tel</a>
    </div>
  </header>

  <main class="stage">
    <button class="proj-item fade-in pi-freelance" data-project="freelance" style="--d1: 1;">
      <span class="proj-tag"></span>
      <span class="proj-name">Freelance</span>
      <span class="shape-wrap">
        <img class="shape-img" src="assets/freelance.png" alt="" aria-hidden="true">
        <canvas class="shape-vid" width="700" height="928" aria-hidden="true"></canvas>
        <video class="shape-src" muted loop playsinline preload="metadata" hidden>
          <source src="assets/anim/freelance.mp4" type="video/mp4">
        </video>
      </span>
    </button>

    <button class="proj-item fade-in pi-prequel" data-project="prequel" style="--d1: 2;">
      <span class="proj-tag"></span>
      <span class="proj-name">Prequel app</span>
      <span class="shape-wrap">
        <img class="shape-img" src="assets/prequel.png" alt="" aria-hidden="true">
        <canvas class="shape-vid" width="700" height="594" aria-hidden="true"></canvas>
        <video class="shape-src" muted loop playsinline preload="metadata" hidden>
          <source src="assets/anim/prequel.mp4" type="video/mp4">
        </video>
      </span>
    </button>

    <button class="proj-item fade-in pi-other" data-project="other" style="--d1: 3;">
      <span class="proj-tag"></span>
      <span class="proj-name">AI Generations</span>
      <span class="shape-wrap">
        <img class="shape-img" src="assets/other.png" alt="" aria-hidden="true">
        <canvas class="shape-vid" width="700" height="276" aria-hidden="true"></canvas>
        <video class="shape-src" muted loop playsinline preload="metadata" hidden>
          <source src="assets/anim/other.mp4" type="video/mp4">
        </video>
      </span>
    </button>

    <button class="proj-item fade-in pi-glam" data-project="glam" style="--d1: 4;">
      <span class="proj-tag"></span>
      <span class="proj-name">Glam app</span>
      <span class="shape-wrap">
        <img class="shape-img" src="assets/glam.png" alt="" aria-hidden="true">
        <canvas class="shape-vid" width="700" height="610" aria-hidden="true"></canvas>
        <video class="shape-src" muted loop playsinline preload="metadata" hidden>
          <source src="assets/anim/glam.mp4" type="video/mp4">
        </video>
      </span>
    </button>

    <button class="proj-item fade-in pi-denim" data-project="denim" style="--d1: 5;">
      <span class="proj-tag"></span>
      <span class="proj-name">495 Denim</span>
      <span class="shape-wrap">
        <img class="shape-img" src="assets/495.png" alt="" aria-hidden="true">
        <canvas class="shape-vid" width="700" height="612" aria-hidden="true"></canvas>
        <video class="shape-src" muted loop playsinline preload="metadata" hidden>
          <source src="assets/anim/495.mp4" type="video/mp4">
        </video>
      </span>
    </button>
  </main>

</div>

<div class="modal-overlay" id="modalOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-scroll" id="modalScroll">
      <span class="modal-label" id="modalLabel"></span>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-meta">
        <span id="modalRole"></span>
        <span id="modalPeriod"></span>
      </div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-media" id="modalMedia"></div>
    </div>
    <div class="modal-scroll-fade" aria-hidden="true"></div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
